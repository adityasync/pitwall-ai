# Scheduled ingestion — nobody runs the pipeline on a laptop anymore.
# This workflow runs on GitHub's machines: it works with your laptop off.
#
# Two modes:
#   schedule (daily 02:00 UTC): diff the OpenF1 calendar against
#     public/data/index.json, build up to 2 missing races (+quali), commit.
#   manual dispatch: paste a backfill spec like "2026 1-14" or
#     "2025 2-17 19-24" and it builds exactly those rounds, then commits.
#     (Actions tab -> ingest -> Run workflow. Works from your phone.)
# Either way: commit back -> Vercel redeploys the app automatically.
name: ingest

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      spec:
        description: 'Backfill spec, e.g. "2026 1-14". Empty = steady-state (newest 2 missing).'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: commit+push from a shallow clone flakes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # NOTE: conditions key on event_name, not just spec emptiness — on a
      # schedule the inputs context is null, and `null == ''` is false, which
      # would silently skip steady-state (and run backfill with no args).
      - name: Build (steady-state)
        if: github.event_name != 'workflow_dispatch' || inputs.spec == ''
        run: |
          set -eo pipefail
          # retry quali-only gaps first (cheap; heals e.g. Baku 2025 if data appears)
          python pipeline/find_new.py --quali-gaps > /tmp/qg.txt
          while read -r year round; do
            [ -z "$year" ] && continue
            echo "=== quali retry $year round $round ==="
            python pipeline/build_quali.py "$year" "$round" || echo "quali still missing, continuing"
          done < /tmp/qg.txt
          python pipeline/find_new.py --max-new 2 > /tmp/new.txt
          while read -r year round; do
            [ -z "$year" ] && continue
            echo "=== building $year round $round ==="
            python pipeline/build_race.py "$year" "$round" || exit 1
            python pipeline/build_quali.py "$year" "$round" || echo "quali failed, continuing"
          done < /tmp/new.txt
          python pipeline/check_data.py
      - name: Build (backfill spec)
        if: github.event_name == 'workflow_dispatch' && inputs.spec != ''
        run: python pipeline/backfill.py ${{ inputs.spec }}
      - name: Commit fresh data
        # runs on step failure too: a red build with 11 good races must still
        # commit them (partial race dirs are unindexed, invisible, self-heal).
        if: success() || failure()
        run: |
          git config user.name "pitwall-ingest"
          git config user.email "pitwall-ingest@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "data: ingest ${{ inputs.spec }} $(date -u +%F)"
          git push || (git pull --rebase && git push)
